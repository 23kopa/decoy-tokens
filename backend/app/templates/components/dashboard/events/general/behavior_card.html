<div class="flex flex-col h-full p-4 component-modal">
  <div class="flex items-center gap-2 mb-3">
    <div class="flex items-center justify-center border rounded-lg w-7 h-7 text-blue-400 bg-blue-500/10 border-blue-500/20">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M3 12h4l3 8 4-16 3 8h4" />
      </svg>
    </div>
    <div class="text-xs font-medium tracking-wider text-gray-400 uppercase">Поведение</div>
  </div>

  {# Тип открытия (главное) #}
  <div class="mb-3 text-base font-semibold leading-tight text-white break-words"
       x-text="selectedEvent?.visit_kind_label || '—'"></div>

  {# Детали #}
  <div class="mt-auto space-y-1.5 text-xs border-t border-gray-600/50 pt-3">

    <div class="flex items-center justify-between text-gray-400"
         x-show="selectedEvent?.fetch_site_header">
      <span>Тип перехода</span>
      <span class="font-mono text-gray-300"
            x-text="selectedEvent?.fetch_site_header"></span>
    </div>

    <div class="flex items-center justify-between text-gray-400"
         x-show="selectedEvent?.fetch_mode_header">
      <span>Тип запроса</span>
      <span class="font-mono text-gray-300"
            x-text="selectedEvent?.fetch_mode_header"></span>
    </div>

    <div class="flex items-center justify-between text-gray-400"
         x-show="selectedEvent?.fetch_dest_header">
      <span>Назначение</span>
      <span class="font-mono text-gray-300"
            x-text="selectedEvent?.fetch_dest_header"></span>
    </div>

    <div class="flex items-center justify-between text-gray-400"
         x-show="selectedEvent?.current_headers?.purpose || selectedEvent?.current_headers?.['x-purpose'] || selectedEvent?.current_headers?.['sec-purpose']">
      <span>Назначение запроса</span>
      <span class="font-mono text-gray-300"
            x-text="selectedEvent?.current_headers?.purpose || selectedEvent?.current_headers?.['x-purpose'] || selectedEvent?.current_headers?.['sec-purpose']"></span>
    </div>

  </div>
</div>
