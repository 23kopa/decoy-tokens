<div x-data="notification" 
     x-show="notifications.length > 0"
     class="fixed z-9999 space-y-2 w-full max-w-sm px-4 left-1/2 top-4 -translate-x-1/2"
     @notification-show.window="show($event.detail.message, $event.detail.type, $event.detail.duration)">
  
  <template x-for="notification in notifications" :key="notification.id">
    <div x-show="notification.visible"
         x-transition:enter="transition ease-out duration-300"
         x-transition:enter-start="opacity-0 -translate-y-2"
         x-transition:enter-end="opacity-100 translate-y-0"
         x-transition:leave="transition ease-in duration-200"
         x-transition:leave-start="opacity-100 translate-y-0"
         x-transition:leave-end="opacity-0 -translate-y-2"
         class="flex items-center gap-3 p-4 border shadow-lg rounded-xl backdrop-blur-sm component-modal"
         :class="notification.type === 'success' ? 'border-emerald-500/30 bg-linear-to-br from-emerald-900/30 to-emerald-800/20' :
                  notification.type === 'error' ? 'border-red-500/30 bg-linear-to-br from-red-900/30 to-red-800/20' :
                  notification.type === 'warning' ? 'border-yellow-500/30 bg-linear-to-br from-yellow-900/30 to-yellow-800/20' :
                  'border-blue-500/30 bg-linear-to-br from-blue-900/30 to-blue-800/20'">
      
      <!-- Иконка в стиле карточек (цветная рамка и фон) -->
      <div class="flex items-center justify-center w-10 h-10 border rounded-xl"
           :class="notification.type === 'success' ? 'border-emerald-500/30 bg-emerald-500/10 text-emerald-400' :
                    notification.type === 'error' ? 'border-red-500/30 bg-red-500/10 text-red-400' :
                    notification.type === 'warning' ? 'border-yellow-500/30 bg-yellow-500/10 text-yellow-400' :
                    'border-blue-500/30 bg-blue-500/10 text-blue-400'">
        <span class="text-lg" x-text="getTypeIcon(notification.type)"></span>
      </div>
      
      <!-- Текст сообщения -->
      <div class="flex-1 text-sm font-medium text-gray-200" x-text="notification.message"></div>
      
      <!-- Кнопка закрытия как в модалке -->
      <button @click="hide(notification.id)"
              class="flex items-center justify-center w-8 h-8 text-gray-400 transition border rounded-lg bg-gray-900/40 border-gray-700/50 hover:bg-gray-800 hover:text-white">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
        </svg>
      </button>
    </div>
  </template>
</div>
