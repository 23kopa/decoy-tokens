{# TOP BAR #}
<div class="mb-4 section-modal">
  
  <div class="flex min-w-0 items-center justify-between pb-3 mb-4 border-b border-gray-600/50">
    
    <div class="flex items-center gap-3">
      {#<div class="relative">
        <div class="w-3 h-3 rounded-full" 
            :class="isActive ? 'bg-emerald-400' : 'bg-gray-500'">
        </div>
        <div x-show="isActive" 
            class="absolute inset-0 w-3 h-3 rounded-full opacity-75 bg-emerald-400 animate-ping">
        </div>
      </div>#}
      <h3 class="min-w-0 truncate text-xl font-bold tracking-tight text-white" x-text="tokenName"></h3>
    </div>

      <div class="shrink-0 px-3 py-1 text-xs font-medium text-gray-300 border rounded-full shadow-inner border-gray-700/50">
        <span class="mr-1 text-gray-500">type:</span>
        <span x-text="tokenType || '—'"></span>
      </div>

  </div>
  
  {# Сетка с информацией о токене #}
  <div class="grid grid-cols-1 gap-3 lg:grid-cols-4">

    <div class="group relative min-w-0 px-3 py-2.5 transition-all duration-100 component-modal-secondary">
      <div class="mb-1 text-2xs font-medium uppercase tracking-wider text-gray-500">ID токена</div>
      <div class="font-mono text-sm text-white">
        <span x-text="tokenId ? tokenId.slice(0, 8) + '...' + tokenId.slice(-6) : '—'"></span>
      </div>
    </div>

    <div class="group relative px-3 py-2.5 transition-all duration-200 component-modal-secondary">
      <div class="text-2xs font-medium tracking-wider text-gray-500 uppercase mb-1">Создан</div>
      <div class="flex items-center gap-1.5 text-sm text-gray-300">
        {{ icons.base_icons('calendar', class="w-3.5 h-3.5 text-gray-500") }}
        <span x-text="tokenTimestamp || '—'"></span>
      </div>
    </div>

    <template x-if="stats">
      <div class="group relative px-3 py-2.5 transition-all duration-200 component-modal-secondary">
        <div class="text-2xs font-medium tracking-wider text-gray-500 uppercase mb-1">Всего событий</div>
        <div class="flex items-baseline gap-1">
          <span class="text-xl font-bold text-white" x-text="stats.total_events"></span>
          <span class="text-xs text-gray-500">событий</span>
        </div>
      </div>
    </template>

    <template x-if="stats">
      <div class="group relative px-3 py-2.5 transition-all duration-200 component-modal-secondary ">
        <div class="text-2xs font-medium tracking-wider text-gray-500 uppercase mb-1">Уникальные</div>
        <div class="flex items-center gap-3">
          <div class="flex items-center gap-1">
            <span class="text-sm font-semibold text-white" x-text="stats.unique_ips"></span>
            <span class="text-2xs text-gray-500">IP</span>
          </div>
          <div class="w-px h-4 bg-gray-700"></div>
          <div class="flex items-center gap-1">
            <span class="text-sm font-semibold text-white" x-text="stats.unique_fingerprints"></span>
            <span class="text-2xs text-gray-500">FP</span>
          </div>
        </div>
      </div>
    </template>

    <template x-if="!stats">
      <div class="col-span-2"></div>
    </template>

  </div>
</div>
