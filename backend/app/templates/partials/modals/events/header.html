{# TOP BAR #}
<div class="mb-4 section-modal">
  
  <div class="flex flex-col gap-2 pb-3 mb-4 border-b border-gray-600/50 sm:flex-row sm:items-center sm:justify-between">
    
    <div class="flex min-w-0 flex-col sm:flex-row sm:items-baseline sm:gap-2">
      
      <h3 class="truncate text-lg font-semibold text-white"
          x-text="tokenName"></h3>

      <span class="font-mono text-xs text-gray-500 sm:relative sm:top-px sm:shrink-0 truncate max-w-[100px]"
            x-text="(tokenId ? tokenId.slice(0, 15) : '—')">
      </span>

    </div>

    <div class="flex flex-wrap items-center gap-2">
      
      <div class="flex items-center gap-1.5 px-2.5 py-1 text-xs font-medium text-gray-400 border rounded-full border-gray-700/50">
        <svg class="w-3 h-3 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M4 4h6v6H4V4zm10 0h6v6h-6V4zM4 14h6v6H4v-6zm10 6h6v-6h-6v6z"/>
        </svg>
        <span x-text="tokenType || '—'"></span>
      </div>

      <div class="flex items-center gap-1.5 px-2.5 py-1 text-xs text-gray-400 border rounded-full border-gray-700/50">
        <svg class="w-3 h-3 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
        </svg>
        <span x-text="tokenTimestamp || '—'"></span>
      </div>

    </div>

  </div>
  
  {# Сетка с информацией о токене #}
  <div class="grid grid-cols-1 gap-3 lg:grid-cols-4">

    <template x-if="stats">
      <div class="group relative px-3 py-2.5 transition-all duration-200 component-modal-secondary">
        <div class="text-2xs font-medium tracking-wider text-gray-500 uppercase mb-1">Всего событий</div>
        <div class="flex items-baseline gap-1">
          <span class="text-lg font-bold text-white" x-text="stats.total_events"></span>
          <span class="text-xs text-gray-500">событий</span>
        </div>
      </div>
    </template>

    <template x-if="stats">
      <div class="group relative px-3 py-2.5 transition-all duration-200 component-modal-secondary ">
        <div class="text-2xs font-medium tracking-wider text-gray-500 uppercase mb-1">Уникальные</div>
        <div class="flex items-center gap-3">
          <div class="flex items-center gap-1">
            <span class="text-lg font-semibold text-white" x-text="stats.unique_ips"></span>
            <span class="text-2xs text-gray-500">IP</span>
          </div>
          <div class="w-px h-4 bg-gray-700"></div>
          <div class="flex items-center gap-1">
            <span class="text-lg font-semibold text-white" x-text="stats.unique_fingerprints"></span>
            <span class="text-2xs text-gray-500">FP</span>
          </div>
        </div>
      </div>
    </template>

    <div class="group relative min-w-0 px-3 py-2.5 transition-all duration-100 component-modal-secondary">
      <div class="mb-1 text-2xs font-medium uppercase tracking-wider text-gray-500">Последний клиент</div>
      <div class="font-mono text-sm text-gray-300">
        <span x-text="selectedEvent?.current_ip"></span>
      </div>
    </div>

    <div class="group relative px-3 py-2.5 transition-all duration-200 component-modal-secondary">
      <div class="text-2xs font-medium tracking-wider text-gray-500 uppercase mb-1">Последняя активность</div>
      <div class="flex items-center gap-1.5 text-sm text-gray-300">
        {{ icons.base_icons('calendar', class="w-3.5 h-3.5 text-gray-500") }}
        <span 
          :title="stats?.last_seen"
          x-text="timeAgo(stats?.last_seen)">
        </span>
      </div>
    </div>



    <template x-if="!stats">
      <div class="col-span-2"></div>
    </template>

  </div>
</div>
