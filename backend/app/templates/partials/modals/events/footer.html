{# FOOTER ACTIONS (sticky) #}
<div class="p-4 mt-4 section-modal">
  <div class="flex flex-wrap items-center gap-3 min-w-0">
    {# Trigger URL #}
    <div class="flex flex-1 min-w-0">
      <div class="flex w-full min-w-0 items-center gap-2 px-3 py-2 border rounded-lg border-gray-700/50 bg-gray-900/30">
      <span class="block sm:hidden text-gray-400 text-sm truncate">
        TRIGGER URL
      </span>

      <span
        class="hidden sm:block flex-1 min-w-0 font-mono text-sm text-gray-300 truncate"
        x-text="triggerUrl || '—'">
      </span>
      </div>
    </div>

    {# Три кнопки #}
    <div class="flex flex-wrap items-center gap-2 shrink-0">
      <button type="button"
              class="flex items-center justify-center w-10 h-10 text-gray-400 transition border rounded-lg bg-gray-900/40 border-gray-700/50 hover:bg-gray-800 hover:text-white disabled:cursor-not-allowed disabled:opacity-50"
              :disabled="!triggerUrl"
              @click="openTriggerUrl()"
              :title="!triggerUrl ? 'URL недоступен' : 'Открыть URL'">
        {{ icons.base_icons('open', class="w-4 h-4") }}
      </button>

      <button type="button"
              class="flex items-center justify-center w-10 h-10 text-gray-400 transition border rounded-lg bg-gray-900/40 border-gray-700/50 hover:bg-gray-800 hover:text-white disabled:cursor-not-allowed disabled:opacity-50"
              :disabled="!triggerUrl"
              @click="copyTriggerUrl()"
              :title="!triggerUrl ? 'URL недоступен' : 'Копировать URL'">
        {{ icons.base_icons('copy', class="w-4 h-4") }}
      </button>

      <button type="button"
              title="Обновить события"
              class="flex items-center justify-center w-10 h-10 text-gray-400 transition border rounded-lg bg-gray-900/40 border-gray-700/50 hover:bg-gray-800 hover:text-white disabled:cursor-not-allowed disabled:opacity-50"
              :disabled="loading || !tokenId || buttonLoading.refresh"
              @click="loadDataWithFeedback()"
              x-loading-button="buttonLoading.refresh">
        <span :class="buttonLoading.refresh ? 'animate-spin' : ''">
          <template x-if="!buttonLoading.refresh">
            {{ icons.base_icons('refresh', class="w-4 h-4") }}
          </template>
          <template x-if="buttonLoading.refresh">
            <svg class="w-4 h-4 animate-spin" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
            </svg>
          </template>
        </span>
      </button>
      
      <button type="button"
              class="flex items-center justify-center w-10 h-10 transition border rounded-lg disabled:cursor-not-allowed disabled:opacity-50"
              :class="isActive
                ? 'border-emerald-800 bg-emerald-900/20 text-emerald-400 hover:bg-emerald-900/30'
                : 'border-gray-700/50 bg-gray-900/40 text-gray-400 hover:bg-gray-800 hover:text-white'"
              :disabled="!tokenId"
              @click="toggleTokenActive()"
              :title="isActive ? 'Отключить токен' : 'Включить токен'">
        {{ icons.base_icons('power', class="w-4 h-4") }}
      </button>
    </div>
  </div>
</div>
