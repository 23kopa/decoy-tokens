<!-- backend/app/templates/partials/modals/tokens/progress_state.html -->

<div
     x-transition:enter="transition ease-out duration-200"
     x-transition:enter-start="opacity-0 translate-y-2"
     x-transition:enter-end="opacity-100 translate-y-0"
     class="w-full py-2"
     x-data="{
       get progressColor() {
         if (this.progress < 30) return 'from-blue-500 to-indigo-400'
         if (this.progress < 70) return 'from-indigo-500 to-purple-400'
         return 'from-emerald-500 to-green-400'
       },
       get statusLabel() {
         if (this.progress < 30) return 'Инициализация'
         if (this.progress < 70) return 'Подготовка'
         if (this.progress < 100) return 'Завершение'
         return 'Готово'
       }
     }">

  <div class="w-full rounded-2xl border border-gray-700/50 p-4 component-modal">
    
    {# Верхняя строка #}
    <div class="flex items-start justify-between gap-3 mb-4">
      <div>
        <div class="text-[11px] font-medium tracking-wider text-gray-500 uppercase">
          Статус операции
        </div>
        <div class="mt-1 text-sm font-semibold text-white">
          <span x-show="progress < 100">Создание токена</span>
          <span x-show="progress >= 100">Токен создан</span>
        </div>
      </div>

      <span class="inline-flex items-center rounded-lg border px-2.5 py-1 text-[11px] font-medium tracking-wide uppercase"
            :class="progress < 100
              ? 'border-blue-500/20 bg-blue-500/10 text-blue-300'
              : 'border-emerald-500/20 bg-emerald-500/10 text-emerald-300'">
        <span x-text="statusLabel"></span>
      </span>
    </div>

    <div class="flex items-center gap-4">
      
      {# Иконка статуса #}
      <div class="relative shrink-0">
        <div x-show="progress < 100"
             class="absolute inset-0 rounded-xl bg-blue-500/10 blur-md"></div>

        <div class="relative flex items-center justify-center border w-11 h-11 rounded-xl"
             :class="progress < 100
               ? 'bg-gradient-to-br from-blue-500/10 to-indigo-500/10 border-blue-500/20 text-blue-400'
               : 'bg-gradient-to-br from-emerald-500/10 to-green-500/10 border-emerald-500/20 text-emerald-400'">

          <template x-if="progress < 100">
            <svg class="w-5 h-5 animate-spin" style="animation-duration: 1.5s" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
            </svg>
          </template>

          <template x-if="progress >= 100">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
            </svg>
          </template>
        </div>
      </div>

      {# Текст + прогресс #}
      <div class="flex-1 min-w-0">
        <div class="flex items-center justify-between gap-3">
          <div class="min-w-0">
            <div class="text-sm text-gray-200">
              <span x-show="progress < 100">Подготавливаем и сохраняем</span>
              <span x-show="progress >= 100">Операция успешно завершена</span>
            </div>
          </div>

          <div class="font-mono text-xs text-gray-400 shrink-0"
               x-text="progress + '%'"></div>
        </div>

        <div class="h-2 mt-3 overflow-hidden border rounded-full bg-gray-800/90 border-gray-700/50">
          <div class="h-full transition-all duration-300 ease-out rounded-full bg-gradient-to-r"
               :class="progressColor"
               :style="'width: ' + progress + '%'">
          </div>
        </div>

        <div class="mt-2 flex items-center justify-between text-[11px] text-gray-500">
          <span x-text="progress < 100 ? 'Пожалуйста, не закрывайте окно' : 'Готово к следующему шагу'"></span>
        </div>
      </div>
    </div>

  </div>
</div>
