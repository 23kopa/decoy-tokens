{% macro type_icons(name, class="w-5 h-5") %}
  {% set base_class = class %}

  {% if name == "link" %}
    <svg class="{{ base_class }}" fill="none" stroke="currentColor" stroke-width="1.5"
         viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path stroke-linecap="round" stroke-linejoin="round"
            d="M13.828 10.172a4 4 0 010 5.656l-3 3a4 4 0 01-5.656-5.656l1.5-1.5m5.656-5.656a4 4 0 015.656 5.656l-1.5 1.5" />
    </svg>

  {% elif name == "email" %}
    <svg class="{{ base_class }}" fill="none" stroke="currentColor" stroke-width="1.5"
         viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round"
            d="M21.75 6.75v10.5a2.25 2.25 0 01-2.25 2.25H4.5A2.25 2.25 0 012.25 17.25V6.75m19.5 0L12 13.5 2.25 6.75m19.5 0A2.25 2.25 0 0019.5 4.5H4.5A2.25 2.25 0 002.25 6.75" />
    </svg>

  {% elif name == "qr" %}
    <svg class="{{ base_class }}" fill="none" stroke="currentColor" stroke-width="1.5"
         viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round"
            d="M4.5 4.5h6v6h-6v-6zm9 0h6v6h-6v-6zm-9 9h6v6h-6v-6zm9 3h3m0 0v3m0-3h-3" />
    </svg>

  {% elif name == "dns" %}
    <svg class="{{ base_class }}" fill="none" stroke="currentColor" stroke-width="1.5"
         viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round"
            d="M3 6h18M3 12h18M3 18h18" />
    </svg>

  {% elif name == "image" %}
    <svg class="{{ base_class }}" fill="none" stroke="currentColor" stroke-width="1.5"
         viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round"
            d="M3 16.5V6.75A2.25 2.25 0 015.25 4.5h13.5A2.25 2.25 0 0121 6.75V16.5M3 16.5l4.5-4.5a2.25 2.25 0 013.182 0L15 16.5M3 16.5h18" />
    </svg>

  {% elif name == "word" %}
    <svg class="{{ base_class }}" fill="none" stroke="currentColor" stroke-width="1.5"
         viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round"
            d="M6.75 3h7.5l3 3v15H6.75A2.25 2.25 0 014.5 18.75V5.25A2.25 2.25 0 016.75 3zM14.25 3v3h3" />
    </svg>
  {% endif %}
{% endmacro %}
