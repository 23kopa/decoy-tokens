<!DOCTYPE html>

<html lang="{{ lang|default('ru') }}" class="h-full">

<head>

  <meta charset="utf-8" />
  <meta name="viewport"
        content="width=device-width, initial-scale=1" />

  <title>
    {% block full_title %} {% block title %}Welcome!{% endblock %} | DecoyTokens {% endblock %}
  </title>

  <meta name="description"
        content="{% block meta_description %}Онлайн-сервис для размещения цифровых ловушек и раннего выявления вторжений.{% endblock %}" />

  {% block head_extra %}{% endblock %}

</head>

<body class="h-screen flex flex-col overflow-hidden {% block body_classes %}{% endblock %}">
    
  {% block content %}{% endblock %}

  {% if use_vite %} 
  <script type="module"
          src="http://localhost:5173/src/main.js"></script>
  {% else %}
  <script type="module"
          src="/static/js/main.js"></script>
  {% endif %}

  {% block scripts %}{% endblock %}
  {% block overlays %}{% endblock %}

  </body>

</html>
