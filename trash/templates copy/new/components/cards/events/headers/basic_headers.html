<div class="p-4 border shadow-lg border-gray-700/50 rounded-2xl bg-gradient-to-br from-gray-800/40 to-gray-900/60 backdrop-blur-sm">
  <div class="flex items-center gap-2 mb-3">
    <div class="w-1.5 h-1.5 rounded-full bg-{{ icon_color }}-400/50"></div>
    <div class="text-[10px] font-medium tracking-wider text-gray-500 uppercase">{{ display_name }}</div>
  </div>
  
  <div class="flex items-center justify-between gap-2">
    <div class="flex-1 font-mono text-xs text-gray-300 break-all truncate"
         x-text="selectedEvent.current_headers?.['{{ header_name }}'] || selectedEvent.current_headers?.['{{ header_name|capitalize }}'] || '—'"></div>
    
    <button type="button"
            class="p-1 transition-opacity rounded opacity-0 group-hover:opacity-100 hover:bg-gray-700 shrink-0"
            x-show="selectedEvent.current_headers?.['{{ header_name }}'] || selectedEvent.current_headers?.['{{ header_name|capitalize }}']"
            @click="copy('{{ header_name }}: ' + (selectedEvent.current_headers?.['{{ header_name }}'] || selectedEvent.current_headers?.['{{ header_name|capitalize }}']))">
      <svg class="w-3 h-3 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"></path>
      </svg>
    </button>
  </div>
</div>
