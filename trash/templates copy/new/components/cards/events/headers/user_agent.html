<div class="overflow-hidden border shadow-lg border-gray-700/50 rounded-2xl bg-gradient-to-br from-gray-800/40 to-gray-900/60 backdrop-blur-sm">
  <div class="flex items-center justify-between px-4 py-3 border-b border-gray-700/50 bg-gray-900/30">
    <div class="flex items-center gap-2">
      <div class="flex items-center justify-center border rounded-lg w-7 h-7 bg-purple-500/10 border-purple-500/20">
        <svg class="w-4 h-4 text-purple-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
        </svg>
      </div>
      <span class="text-xs font-medium tracking-wider text-gray-400 uppercase">User Agent</span>
    </div>
    <button type="button"
            class="flex items-center gap-1 px-2 py-1 text-xs text-gray-300 transition border rounded-md bg-gray-800/50 border-gray-700/30 hover:bg-gray-700/60 hover:text-white"
            @click="copy(selectedEvent.current_user_agent || '')">
      <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"></path>
      </svg>
      <span>Копировать</span>
    </button>
  </div>

  <div class="p-4">
    <template x-if="!selectedEvent.current_user_agent">
      <div class="text-sm italic text-gray-500">—</div>
    </template>
    <template x-if="selectedEvent.current_user_agent">
      <div class="relative group">
        <div class="p-3 font-mono text-sm text-gray-200 break-all border rounded-lg bg-gray-900/60 border-gray-700/30"
            x-text="selectedEvent.current_user_agent"></div>
        
        {# Быстрый анализ User Agent #}
        <div class="absolute flex gap-1 transition-opacity opacity-0 top-2 right-2 group-hover:opacity-100">
          <span class="px-2 py-1 text-[10px] rounded-md bg-gray-800 text-gray-400 border border-gray-700"
                x-text="detectBrowser(selectedEvent.current_user_agent)"></span>
          <span class="px-2 py-1 text-[10px] rounded-md bg-gray-800 text-gray-400 border border-gray-700"
                x-text="detectOS(selectedEvent.current_user_agent)"></span>
        </div>
      </div>
    </template>
  </div>
</div>
