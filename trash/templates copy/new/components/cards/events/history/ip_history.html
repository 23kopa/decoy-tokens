<div class="space-y-3">
  {# Блок с историей (когда есть данные) #}
  <template x-if="selectedEvent.ip_history && selectedEvent.ip_history.length > 0">
    <details class="overflow-hidden border shadow-lg border-gray-700/50 rounded-2xl bg-gradient-to-br from-gray-800/40 to-gray-900/60 backdrop-blur-sm">
      <summary class="flex items-center justify-between px-4 py-3 list-none transition-colors cursor-pointer bg-gray-900/30 hover:bg-gray-800/30">
        <div class="flex items-center gap-2">
          <div class="flex items-center justify-center border rounded-lg w-7 h-7 bg-blue-500/10 border-blue-500/20">
            <svg class="w-4 h-4 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9m-9 9a9 9 0 019-9"></path>
            </svg>
          </div>
          <div>
            <span class="text-xs font-medium tracking-wider text-gray-400 uppercase">История IP адресов</span>
            <span class="ml-2 text-xs text-gray-500"
                  x-text="new Set((selectedEvent.ip_history || []).map(entry => entry.ip).filter(Boolean)).size + ' в истории'">
            </span>
          </div>
        </div>
        {{ icons.chevron_indicator('down') }}
      </summary>

      <div class="p-4 space-y-2 border-t border-gray-700/50">
        <template x-for="(entry, idx) in selectedEvent.ip_history.slice().reverse()" :key="idx">
          <div class="flex items-center justify-between gap-3 px-3 py-2 border rounded-lg border-gray-700/50 bg-gradient-to-br from-gray-800/40 to-gray-900/60">
            <div class="min-w-0 font-mono text-sm text-white truncate"
                x-text="entry.ip || '—'"></div>
            <div class="flex items-center gap-2 shrink-0">
              <span class="text-xs text-gray-500" x-text="formatDate(entry.timestamp)"></span>
              <button type="button"
                      class="p-1 transition-opacity rounded opacity-0 group-hover:opacity-100 hover:bg-gray-700"
                      @click="copy(entry.ip)">
                <svg class="w-3 h-3 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"></path>
                </svg>
              </button>
            </div>
          </div>
        </template>
      </div>
    </details>
  </template>

  {# Empty state (когда нет истории) #}
  <template x-if="!selectedEvent.ip_history || selectedEvent.ip_history.length === 0">
    <div class="flex flex-col items-center justify-center py-12 text-center border shadow-lg border-gray-700/50 rounded-2xl bg-gradient-to-br from-gray-800/40 to-gray-900/60 backdrop-blur-sm">
      
      <div class="flex items-center justify-center w-16 h-16 mb-4 border rounded-2xl border-gray-700/50 bg-gradient-to-br from-gray-800/40 to-gray-900/60">
        <svg class="w-8 h-8 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9m-9 9a9 9 0 019-9"></path>
        </svg>
      </div>

      <div class="max-w-sm">
        <h4 class="mb-2 text-sm font-semibold text-gray-300">
          История IP адресов отсутствует
        </h4>
        <p class="text-xs leading-relaxed text-gray-500">
          Для этого события пока нет записей об изменении IP адресов.<br>
          История появляется при повторных обращениях с разных IP.
        </p>
      </div>

      
    </div>
  </template>
</div>
