<div class="flex flex-col h-full p-4 border shadow-lg border-gray-700/50 rounded-2xl bg-gradient-to-br from-gray-800/40 to-gray-900/60 backdrop-blur-sm">
  <div class="flex items-center gap-2 mb-3">
    <div class="flex items-center justify-center text-purple-400 border rounded-lg w-7 h-7 bg-purple-500/10 border-purple-500/20">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path>
      </svg>
    </div>
    <div class="text-xs font-medium tracking-wider text-gray-400 uppercase">Провайдер</div>
  </div>

  <div class="mb-3 font-mono text-base font-semibold leading-tight text-white break-words" 
       x-text="selectedEvent?.geo?.as_org || selectedEvent?.org || '—'"></div>

  {# Дополнительная информация списком #}
  <div class="mt-auto space-y-1.5 text-xs border-t border-gray-600/50 pt-3">
    <div class="flex items-center justify-between text-gray-400" x-show="selectedEvent?.geo?.asn">
      <span>ASN</span>
      <span class="font-mono text-gray-300" x-text="'AS' + selectedEvent?.geo?.asn"></span>
    </div>
    
    <div class="flex items-center justify-between text-gray-400" x-show="selectedEvent?.geo?.connection_type">
      <span>Тип</span>
      <span class="text-gray-300" x-text="selectedEvent?.geo?.connection_type"></span>
    </div>
    
    <div class="flex items-center justify-between text-gray-400" x-show="selectedEvent?.current_ip_data?.detection_method && selectedEvent?.current_ip_data?.detection_method !== 'direct'">
      <span>Метод</span>
      <span class="text-gray-300" x-text="selectedEvent?.current_ip_data?.detection_method"></span>
    </div>
  </div>
</div>
