<button type="button"
        @click="selectEvent(event)"
        class="w-full p-3 mb-2 text-left transition-all duration-200 border rounded-xl group"
        :class="selectedEvent?.id === event.id 
          ? 'border-blue-500/50 bg-gradient-to-br from-blue-500/5 to-purple-500/5 shadow-lg shadow-blue-500/5' 
          : 'border-gray-800 bg-gradient-to-br from-gray-800/40 to-gray-900/60 hover:border-gray-600 hover:shadow-md backdrop-blur-sm'">

  {# Верхняя часть с IP и статусом #}
  <div class="flex items-start justify-between gap-3">
    <div class="flex items-center min-w-0 gap-3">
      {# Иконка с цветом в зависимости от статуса #}
      <div class="flex items-center justify-center text-lg border rounded-xl h-9 w-9 shrink-0"
           :class="event.is_first 
             ? 'border-emerald-500/30 bg-emerald-500/10 text-emerald-400' 
             : (event.additional_data?.bot_info?.is_bot 
               ? 'border-purple-500/30 bg-purple-500/10 text-purple-400' 
               : 'border-gray-700 bg-gray-800/60 text-gray-400')">
        <span x-text="getEventIcon(event)"></span>
      </div>
      
      <div class="min-w-0">
        <div class="flex items-center gap-2">
          <div class="font-mono text-sm font-semibold text-white truncate" 
               x-text="formatIP(event.current_ip)"></div>
        </div>
        <div class="flex items-center gap-2 mt-0.5 text-xs text-gray-500">
          <span x-text="formatDate(event.last_seen)"></span>
        </div>
      </div>
    </div>

    {# Статус с цветом #}
    <span class="shrink-0 rounded-full px-2.5 py-1 text-[10px] font-medium border"
          :class="getEventStatusColor(event)"
          x-text="event.is_first ? 'ПЕРВЫЙ' : (event.additional_data?.bot_info?.is_bot ? 'БОТ' : 'ПОВТОР')">
    </span>
  </div>

  {# User Agent с иконкой #}
  <div class="flex items-center gap-2 pt-2 mt-2 text-xs border-t border-gray-700/50">
    <svg class="w-3.5 h-3.5 text-gray-600 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
    </svg>
    <div class="text-gray-400 truncate" x-text="formatUserAgent(event.current_user_agent)"></div>
  </div>
  
</button>
