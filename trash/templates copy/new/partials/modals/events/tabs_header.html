<div class="sticky top-0 z-10 bg-gray-700 border-b border-gray-800">

  {# META HEADER #}
  <div class="flex items-center justify-between gap-3 px-4 py-3">
    <div class="min-w-0">
      <div class="text-sm font-semibold text-gray-200">Детали события</div>
      <div class="mt-1 font-mono text-xs text-gray-500">
        FP:
        <span class="text-gray-400" x-text="selectedEvent?.fingerprint || '—'"></span>
      </div>
    </div>

    <div class="flex items-center gap-1 shrink-0">
      <span class="inline-flex rounded-lg border px-2 py-1 text-[11px]"
            x-show="selectedEvent"
            :class="selectedEvent ? getEventStatusColor(selectedEvent) : ''"
            x-text="selectedEvent ? (selectedEvent.is_first ? 'Первый' : (selectedEvent.additional_data?.bot_info?.is_bot ? 'Бот' : 'Повтор')) : ''">
      </span>

      <template x-if="selectedEvent && selectedEvent.seen_count > 1">
        <span class="inline-flex rounded-lg border px-2 py-1 text-[11px] border-gray-700 text-gray-300 bg-gray-900/20">
          ×<span x-text="selectedEvent.seen_count"></span>
        </span>
      </template>
    </div>
  </div>

  {# NAV / ACTION BAR #}
  <div class="flex items-center justify-between gap-3 px-4 py-2 border-t border-gray-800">
    <div class="flex flex-wrap items-center gap-1">
      <button type="button"
              @click="tab = 'summary'"
              class="rounded-lg px-3 py-1.5 text-xs font-medium transition"
              :class="tab === 'summary'
                ? 'bg-gray-800 text-white shadow-sm'
                : 'border-gray-800 text-gray-300 bg-gray-900/40 hover:bg-gray-800'">
        Сводка
      </button>

      <button type="button"
              @click="tab = 'headers'"
              class="rounded-lg px-3 py-1.5 text-xs font-medium transition"
              :class="tab === 'headers'
                ? 'bg-gray-800 text-white shadow-sm'
                : 'border-gray-800 text-gray-300 bg-gray-900/40 hover:bg-gray-800'">
        Headers
      </button>

      <button type="button"
              @click="tab = 'history'"
              class="rounded-lg px-3 py-1.5 text-xs font-medium transition"
              :class="tab === 'history'
                ? 'bg-gray-800 text-white shadow-sm'
                : 'border-gray-800 text-gray-300 bg-gray-900/40 hover:bg-gray-800'">
        История
      </button>

    </div>

    <div class="flex items-center gap-1 shrink-0">
      <button type="button"
              title="Скачать JSON события"
              class="flex items-center justify-center w-8 h-8 text-gray-300 border border-gray-800 rounded-lg bg-gray-900/40 hover:bg-gray-800"
              :disabled="!selectedEvent"
              @click="downloadEvent(selectedEvent)">
        {{ icons.base_icons('download', class="w-4 h-4") }}
      </button>

      <button type="button"
              title="Обновить события"
              class="flex items-center justify-center w-8 h-8 text-gray-300 border border-gray-800 rounded-lg bg-gray-900/40 hover:bg-gray-800"
              :disabled="loading || !tokenId"
              @click="loadData()">
        <span :class="loading ? 'animate-spin' : ''">
          {{ icons.base_icons('refresh', class="w-4 h-4") }}
        </span>
      </button>
    </div>
  </div>

</div>
