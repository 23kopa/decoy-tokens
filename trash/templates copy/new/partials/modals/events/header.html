{# TOP BAR #}
<div class="sticky top-0 z-10 p-5 mb-4 border shadow-lg rounded-2xl bg-gradient-to-br from-gray-800/40 to-gray-900/60 backdrop-blur-sm border-gray-700/50">
  
  <div class="flex items-center justify-between mb-3">
    <div class="flex items-center gap-3">
      <div class="relative">
        <div class="w-3 h-3 rounded-full" 
            :class="isActive ? 'bg-emerald-400' : 'bg-gray-500'">
        </div>
        <div x-show="isActive" 
            class="absolute inset-0 w-3 h-3 rounded-full opacity-75 bg-emerald-400 animate-ping">
        </div>
      </div>
      <h3 class="text-xl font-bold tracking-tight text-white" x-text="tokenName"></h3>
    </div>
    <div class="flex items-center gap-2">
      <div class="px-2.5 py-1 text-xs font-medium rounded-full bg-gray-700 text-gray-300" x-text="'type: ' + (tokenType || '—')"></div>
    </div>
  </div>
  
  {# Сетка с информацией о токене #}
  <div class="grid grid-cols-4 gap-4 mb-1">
    <div class="px-3 py-2 border rounded-lg border-gray-700/50 bg-gray-900/30">
      <div class="text-[10px] font-medium tracking-wider text-gray-500 uppercase mb-1">ID токена</div>
      <div class="font-mono text-sm text-white truncate" x-text="tokenId || '—'"></div>
    </div>
    <div class="px-3 py-2 border rounded-lg border-gray-700/50 bg-gray-900/30">
      <div class="text-[10px] font-medium tracking-wider text-gray-500 uppercase mb-1">Создан</div>
      <div class="flex items-center gap-1.5 text-sm text-gray-300">
        {{ icons.base_icons('calendar', class="w-3.5 h-3.5 text-gray-500") }}
        <span x-text="tokenTimestamp || '—'"></span>
      </div>
    </div>
    <template x-if="stats">
      <div class="px-3 py-2 border rounded-lg border-gray-700/50 bg-gray-900/30">
        <div class="text-[10px] font-medium tracking-wider text-gray-500 uppercase mb-1">Всего событий</div>
        <div class="flex items-baseline gap-1">
          <span class="text-xl font-bold text-white" x-text="stats.total_events"></span>
          <span class="text-xs text-gray-500">событий</span>
        </div>
      </div>
    </template>
    <template x-if="stats">
      <div class="px-3 py-2 border rounded-lg border-gray-700/50 bg-gray-900/30">
        <div class="text-[10px] font-medium tracking-wider text-gray-500 uppercase mb-1">Уникальные</div>
        <div class="flex items-center gap-3">
          <div class="flex items-center gap-1">
            <span class="text-sm font-semibold text-white" x-text="stats.unique_ips"></span>
            <span class="text-[10px] text-gray-500">IP</span>
          </div>
          <div class="w-px h-4 bg-gray-700"></div>
          <div class="flex items-center gap-1">
            <span class="text-sm font-semibold text-white" x-text="stats.unique_fingerprints"></span>
            <span class="text-[10px] text-gray-500">FP</span>
          </div>
        </div>
      </div>
    </template>
    <template x-if="!stats">
      <div class="col-span-2"></div>
    </template>
  </div>
</div>
