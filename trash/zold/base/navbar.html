<header class="antialiased">
  <nav class="bg-gray-900 border-b border-gray-800 px-4 py-2.5">
    <div class="flex items-center justify-between">

      {# LEFT #}
      <div class="flex items-center gap-3">
        <a href="/home"
           class="flex items-center gap-2">
          {# если хочешь свой логотип — положи в static и замени src #}
          <span class="text-lg font-semibold text-white whitespace-nowrap">
            DecoyTokens
          </span>
        </a>
      </div>

      {# RIGHT #}
      <div class="flex items-center gap-2">
        <button type="button"
                class="flex items-center text-sm rounded-full focus:ring-4 focus:ring-gray-700"
                id="user-menu-button"
                aria-expanded="false"
                data-dropdown-toggle="user-dropdown">
          <span class="sr-only">Open user menu</span>
          <div class="flex items-center justify-center w-8 h-8 text-white bg-gray-700 rounded-full">
            {{ (user.username[:1] if user and user.username else "U")|upper }}
          </div>
        </button>

        <div class="z-50 hidden w-56 my-4 text-base list-none bg-white divide-y divide-gray-100 rounded shadow dark:bg-gray-800 dark:divide-gray-700"
             id="user-dropdown">
          <div class="px-4 py-3">
            <span class="block text-sm font-semibold text-gray-900 dark:text-white">
              {{ user.username }}
            </span>
            <span class="block text-sm text-gray-500 truncate dark:text-gray-400">
              {{ user.email }}
            </span>
          </div>

          <ul class="py-1 text-gray-700 dark:text-gray-300"
              aria-labelledby="user-menu-button">
            <li>
              <a href="/home"
                 class="block px-4 py-2 text-sm hover:bg-gray-100 dark:hover:bg-gray-700">
                Главная
              </a>
            </li>
          </ul>

          <ul class="py-1 text-gray-700 dark:text-gray-300"
              aria-labelledby="user-menu-button">
            <li>
              <a href="/dashboard"
                 class="block px-4 py-2 text-sm hover:bg-gray-100 dark:hover:bg-gray-700">
                Дашборд
              </a>
            </li>
          </ul>

          <ul class="py-1 text-gray-700 dark:text-gray-300"
              aria-labelledby="user-menu-button">
            <li>
              <form action="/auth/logout"
                    method="post">
                <button type="submit"
                        class="w-full px-4 py-2 text-sm text-left hover:bg-gray-100 dark:hover:bg-gray-700">
                  Выйти
                </button>
              </form>
            </li>
          </ul>
        </div>
      </div>

    </div>
  </nav>
</header>
