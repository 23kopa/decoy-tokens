# Общий лимит + логформат
limit_req_zone $binary_remote_addr zone=reqlimit_perip:10m rate=10r/s;

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

# 1) HTTP :80 — редирект на HTTPS и выдача ACME-челленжей
server {
  listen 80;
  listen [::]:80;
  server_name tokenguard.ru www.tokenguard.ru;

  # Разрешаем certbot проверку
  location ^~ /.well-known/acme-challenge/ {
    root /var/www/html;
    default_type "text/plain";
    allow all;
  }

  # остальное — на https
  location / {
    return 301 https://$host$request_uri;
  }
}

# 2) HTTPS :443 — основной сайт
server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name tokenguard.ru www.tokenguard.ru;

  # TLS сертификаты (включить после получения сертификатов)
  # ssl_certificate     /etc/letsencrypt/live/tokenguard.ru/fullchain.pem;
  # ssl_certificate_key /etc/letsencrypt/live/tokenguard.ru/privkey.pem;
  
  # Безопасные заголовки
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
  # HSTS (включите после проверки)
  # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  # Ограничения
  client_max_body_size 25m;
  limit_req zone=reqlimit_perip burst=20 nodelay;

  # Логи
  access_log /var/log/nginx/tokenguard.access.log;
  error_log  /var/log/nginx/tokenguard.error.log warn;

  # Статика напрямую (путь к статике в Docker-проекте)
  location = /favicon.ico {
    alias /var/www/tokenguard/backend/app/static/favicon.ico;
    access_log off;
  }
  
  location /static/ {
    alias /var/www/tokenguard/backend/app/static/;
    expires 30d;
    access_log off;
    add_header Cache-Control "public, max-age=2592000";
  }

  # Прокси на Docker-контейнер с Uvicorn
  location / {
    proxy_pass http://localhost:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    
    # WebSocket поддержка
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    
    # Таймауты
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
  }
}
