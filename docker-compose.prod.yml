services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile.prod
    env_file:
      - .env
    command: uvicorn backend.app.main:app --host 0.0.0.0 --port 8000
    depends_on:
      - postgres
    volumes:
      - ./alembic.ini:/app/alembic.ini 
    ports:
      - "8000:8000"
    networks:
      - backend

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-decoy_tokens_prod}
      POSTGRES_USER: ${POSTGRES_USER:-prod_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vS2qHMO8fsf862QYEa}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432" 
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  postgres_prod_data: